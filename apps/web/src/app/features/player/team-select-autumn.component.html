<div class="autumn-theme autumn-fade-in">
  <div class="autumn-leaves"></div>
  <div class="autumn-decor">
    <div class="decor-circle decor-circle-1"></div>
    <div class="decor-circle decor-circle-2"></div>
    <div class="decor-circle decor-circle-3"></div>
    <svg class="decor-leaf decor-leaf-1" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M20 5C20 5 10 10 8 20C6 30 12 35 20 35C20 35 20 20 20 5Z" fill="#c87250" />
      <path d="M20 5C20 5 30 10 32 20C34 30 28 35 20 35C20 35 20 20 20 5Z" fill="#d9794d" />
    </svg>
    <svg class="decor-leaf decor-leaf-2" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M20 5C20 5 10 10 8 20C6 30 12 35 20 35C20 35 20 20 20 5Z" fill="#d4a574" />
      <path d="M20 5C20 5 30 10 32 20C34 30 28 35 20 35C20 35 20 20 20 5Z" fill="#c9a87f" />
    </svg>
  </div>

  <div class="autumn-container">
    <header class="autumn-header">
      <h1>
        <span class="autumn-icon">👥</span>
        Formation des Équipes
      </h1>
      <div class="event-subtitle">
        Bienvenue <strong>{{ nickname }}</strong> !
      </div>
    </header>

    <!-- Équipes existantes -->
    <div class="autumn-card autumn-card-plain">
      <h3>
        <span class="autumn-section-icon">🏆</span>
        Équipes Disponibles
      </h3>

      <div *ngIf="teams.length === 0" class="autumn-message message-info">
        <span>⏳</span>
        Chargement des équipes...
      </div>

      <div *ngIf="teams.length > 0" class="teams-grid">
        <div *ngFor="let t of teams" class="team-card" (click)="selectTeam(t.id)">
          <div class="team-card-content">
            <div class="team-icon">🎭</div>
            <div class="team-details">
              <span class="team-label">Équipe</span>
              <span class="team-name">{{ t.name }}</span>
            </div>
            <div class="team-action">
              <span>Rejoindre</span>
              <span class="team-arrow">→</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Créer nouvelle équipe -->
    <div class="autumn-card autumn-card-plain">
      <h3>
        <span class="autumn-section-icon">✨</span>
        Créer une Nouvelle Équipe
      </h3>

      <div class="team-creation-form">
        <label for="newTeam" class="autumn-label">Nom de votre équipe</label>
        <input
          id="newTeam"
          [(ngModel)]="newTeam"
          placeholder="Les Virtuoses d'Automne..."
          class="autumn-input"
          maxlength="30"
          (keyup.enter)="createTeam()"
        />

        <button
          (click)="createTeam()"
          [disabled]="!newTeam.trim()"
          class="btn-autumn btn-autumn-success"
        >
          <span class="btn-icon">🌟</span>
          Créer l'Équipe
        </button>
      </div>

      <div class="autumn-message message-info">
        <span>💡</span>
        Choisissez un nom créatif qui représente votre équipe pour cette soirée musicale !
      </div>
    </div>

    <div class="autumn-footer-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</div>
